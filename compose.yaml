# Starts the MySQL database. These credentials are for local development only.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: lastworche
      MYSQL_USER: lastworche
      MYSQL_PASSWORD: lastworche
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ulastworche -plastworche --silent"]
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  mysql-data:
